<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="page">
        <h1>World Cup 2022 Dashboard</h1>

        <section class="chart-grid">
            <article class="chart-card">
                <h2>Points by Team</h2>
                <div id="points-chart" class="responsive-svg-container"></div>
            </article>

            <article class="chart-card">
                <h2>Goal Share</h2>
                <div id="goals-chart" class="responsive-svg-container"></div>
            </article>

            <article class="chart-card chart-card-wide">
                <h2>Goal Difference</h2>
                <div id="diff-chart" class="responsive-svg-container"></div>
            </article>

            <article class="chart-card chart-card-empty" aria-hidden="true"></article>
            <article class="chart-card chart-card-empty" aria-hidden="true"></article>
            <article class="chart-card chart-card-empty" aria-hidden="true"></article>
        </section>
    </main>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
